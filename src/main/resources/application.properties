spring.application.name=restaurante

# PostgreSQL (relacional): platos, mesas, cuentas, pedidos, reservas, parqueadero y usuarios
spring.datasource.url=${DB_URL:jdbc:postgresql://localhost:5432/brasaviva}
spring.datasource.username=${DB_USER:brasa}
spring.datasource.password=${DB_PASSWORD}
spring.jpa.hibernate.ddl-auto=update
spring.jpa.show-sql=${SHOW_SQL:true}
spring.jpa.open-in-view=false

# MongoDB (no relacional): auditoria de cambios de estado de los pedidos
# Local: mongodb://localhost:27017/brasaviva  |  Atlas: mongodb+srv://<usuario>:<clave>@<cluster>/brasaviva
spring.mongodb.uri=${MONGODB_URI:mongodb://localhost:27017/brasaviva}
spring.mongodb.database=${MONGODB_DATABASE:brasaviva}

# Seguridad (JWT). El secreto se pasa por variable de entorno, nunca se sube al repositorio
app.jwt.secret=${JWT_SECRET}
app.jwt.expiration-minutes=${JWT_EXPIRATION_MINUTES:60}
app.admin.username=${ADMIN_USERNAME:}
app.admin.password=${ADMIN_PASSWORD:}
app.cors.allowed-origins=${CORS_ALLOWED_ORIGINS:http://localhost:5173,http://localhost:3000}
