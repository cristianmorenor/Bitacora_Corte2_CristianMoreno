spring.application.name=restaurante

# Los tests usan H2 en memoria: no necesitan PostgreSQL corriendo (ni en local ni en el pipeline de CI)
spring.datasource.url=jdbc:h2:mem:brasaviva;MODE=PostgreSQL;DB_CLOSE_DELAY=-1
spring.datasource.username=sa
spring.datasource.password=
spring.jpa.hibernate.ddl-auto=create-drop
spring.jpa.open-in-view=false

# Mongo no se conecta en los tests: el repositorio de auditoria se reemplaza por un mock
spring.mongodb.uri=mongodb://localhost:27017/brasaviva-test
spring.mongodb.database=brasaviva-test

app.jwt.secret=clave-solo-para-tests-con-mas-de-32-caracteres
app.jwt.expiration-minutes=60
app.admin.username=admin
app.admin.password=AdminTest2026
app.cors.allowed-origins=http://localhost:5173
