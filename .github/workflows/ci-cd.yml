name: CI/CD LA BRASA VIVA

on:
  push:
    branches: [ main, develop ]
  pull_request:
    branches: [ main, develop ]
  workflow_dispatch:

env:
  IMAGEN: ghcr.io/${{ github.repository_owner }}/brasa-viva-api

jobs:
  build-test:
    name: Build y pruebas
    runs-on: ubuntu-latest
    steps:
      - name: Descargar el codigo
        uses: actions/checkout@v4

      - name: Configurar Java 24
        uses: actions/setup-java@v4
        with:
          distribution: temurin
          java-version: '24'
          cache: maven

      # Los tests usan H2 en memoria y un mock de Mongo: no necesitan bases de datos en el pipeline
      - name: Compilar, ejecutar pruebas y generar cobertura
        run: mvn -B verify

      - name: Publicar reporte de cobertura JaCoCo
        if: always()
        uses: actions/upload-artifact@v4
        with:
          name: reporte-jacoco
          path: target/site/jacoco/

      - name: Publicar jar
        uses: actions/upload-artifact@v4
        with:
          name: restaurante-jar
          path: target/*.jar

  docker:
    name: Construir y publicar imagen Docker
    needs: build-test
    # Solo se publica la imagen cuando el cambio llega a main
    if: github.event_name == 'push' && github.ref == 'refs/heads/main'
    runs-on: ubuntu-latest
    permissions:
      contents: read
      packages: write
    steps:
      - name: Descargar el codigo
        uses: actions/checkout@v4

      - name: Configurar Docker Buildx
        uses: docker/setup-buildx-action@v3

      # La credencial del registro viene de los secrets de GitHub, nunca del codigo
      - name: Iniciar sesion en GitHub Container Registry
        uses: docker/login-action@v3
        with:
          registry: ghcr.io
          username: ${{ github.actor }}
          password: ${{ secrets.GITHUB_TOKEN }}

      - name: Construir y publicar la imagen
        uses: docker/build-push-action@v6
        with:
          context: .
          push: true
          tags: |
            ${{ env.IMAGEN }}:latest
            ${{ env.IMAGEN }}:${{ github.sha }}
          cache-from: type=gha
          cache-to: type=gha,mode=max

  deploy:
    name: Desplegar
    needs: docker
    runs-on: ubuntu-latest
    env:
      # URL del "Deploy Hook" del servicio en la nube (por ejemplo Render), guardada como secret del repositorio
      DEPLOY_HOOK_URL: ${{ secrets.DEPLOY_HOOK_URL }}
    steps:
      - name: Disparar el despliegue de la nueva imagen
        if: env.DEPLOY_HOOK_URL != ''
        run: curl -fsS -X POST "$DEPLOY_HOOK_URL" > /dev/null

      - name: Aviso si no hay destino de despliegue configurado
        if: env.DEPLOY_HOOK_URL == ''
        run: echo "Imagen publicada en ${{ env.IMAGEN }}. Configura el secret DEPLOY_HOOK_URL para desplegar automaticamente."
